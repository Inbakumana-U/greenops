server:
  port: 8080

spring:
  application:
    name: greenops-core
  datasource:
    url: jdbc:postgresql://localhost:5432/sustaindb
    username: sustain
    password: sustainpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true